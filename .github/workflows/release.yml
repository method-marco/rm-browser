name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Install Qt rcc
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev-tools
      - name: Test
        run: make test
      - name: Build
        run: make all RCC=/usr/lib/qt6/libexec/rcc VERSION=${GITHUB_REF_NAME#v}
      - name: Checksums
        run: cd dist && sha512sum *.tar.gz | tee SHA512SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm-browser
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/rm-browser-aarch64.tar.gz
            dist/rm-browser-armv7.tar.gz
            dist/SHA512SUMS
