name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Install Qt rcc
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev-tools
      - name: Test
        run: make test
      - name: Build
        run: make all RCC=/usr/lib/qt6/libexec/rcc VERSION=${GITHUB_REF_NAME#v}
      - name: Checksums
        run: cd dist && sha512sum *.tar.gz | tee SHA512SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rm-browser
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/rm-browser-aarch64.tar.gz
            dist/rm-browser-armv7.tar.gz
            dist/SHA512SUMS
