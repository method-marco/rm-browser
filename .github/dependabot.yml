# Weekly pull requests for dependency updates. CI (release.yml) builds and
# runs the backend tests on each one; merge when green.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go:            # one PR for all Go modules
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
